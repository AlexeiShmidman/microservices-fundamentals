server:
  port: 8082

spring:
  application:
    name: song-service

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song_db}"
    username: "${SPRING_DATASOURCE_USERNAME:song_user}"
    password: "${SPRING_DATASOURCE_PASSWORD:song_pass}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.example.songservice: DEBUG
    org.hibernate.SQL: DEBUG
