server:
  port: 8081

spring:
  application:
    name: resource-service

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_db}"
    username: "${SPRING_DATASOURCE_USERNAME:resource_user}"
    password: "${SPRING_DATASOURCE_PASSWORD:resource_pass}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

song-service:
  base-url: "${SONG_SERVICE_BASE_URL:http://localhost:8082}"
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

resilience4j:
  retry:
    instances:
      songService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - com.example.resourceservice.exception.SongServiceException
        ignore-exceptions:
          - com.example.resourceservice.exception.SongServiceConflictException
      songServiceDelete:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - com.example.resourceservice.exception.SongServiceException

logging:
  level:
    com.example.resourceservice: DEBUG
    org.hibernate.SQL: DEBUG
